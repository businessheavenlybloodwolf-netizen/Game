name: Minecraft-Mod bauen

on:
  push:
    paths: ['haptics-bridge/minecraft-mod/**', '.github/workflows/minecraft-mod.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haptics-bridge/minecraft-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: haptics-bridge-minecraft
          path: haptics-bridge/minecraft-mod/build/libs/*.jar
