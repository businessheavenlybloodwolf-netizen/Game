<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LUMI und das Morgenlicht</title>
<style>/*CSS*/</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="tl">
    <div id="hearts"></div>
    <div class="pill" id="lives"></div>
  </div>
  <div class="tr">
    <div class="pill" id="sparks"></div>
    <div class="pill" id="moons"></div>
    <div class="pill" id="shards"></div>
    <div class="pill" id="timer">0:00</div>
  </div>
  <div id="bossbar"></div>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="hint"></div>
</div>
<div id="touch">
  <div class="camzone"></div>
  <div class="stick"><div class="knob"></div></div>
  <div data-btn="jump"></div>
  <div data-btn="spin"></div>
  <div data-btn="pound"></div>
  <div data-btn="pause">II</div>
</div>
<div id="fade"></div>
<div id="screen"></div>
<div id="dialog"><div class="who"></div><div class="text"></div><div class="next">▶</div></div>
<div id="error"></div>
<!--SCRIPT-->
</body>
</html>
