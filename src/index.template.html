<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LUMI und das Morgenlicht</title>
<style>/*CSS*/</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="tl">
    <div id="hearts"></div>
    <div class="pill" id="lives"></div>
  </div>
  <div class="tr">
    <div class="pill" id="sparks"></div>
    <div class="pill" id="moons"></div>
    <div class="pill" id="shards"></div>
    <div class="pill" id="timer">0:00</div>
    <div id="quest"><div class="qt"></div><div class="qg"></div></div>
  </div>
  <div id="bossbar"></div>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="prompt"></div>
  <div id="race"></div>
</div>
<div id="fade"></div>
<div id="screen"></div>
<div id="cinebars"><i></i><i></i></div>
<div id="dialog"><div class="who"></div><div class="text"></div><div class="next">▶</div></div>
<div id="error"></div>
<!--SCRIPT-->
</body>
</html>
